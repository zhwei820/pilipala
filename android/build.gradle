allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    // 部分旧版 pub 插件未声明 namespace（AGP 8+ 必填），从其 manifest 的 package 属性补上
    plugins.withId('com.android.library') {
        def manifest = project.file('src/main/AndroidManifest.xml')
        if (project.android.namespace == null && manifest.exists()) {
            project.android.namespace = new XmlSlurper().parse(manifest).@package.text()
        }
        // 旧插件 compileSdk 过低，编不过新版 androidx 依赖的 AAR metadata 检查
        project.androidComponents.finalizeDsl { ext ->
            if (ext.compileSdk == null || ext.compileSdk < 34) {
                ext.compileSdk = 34
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
